<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Accessible baseline — Ally fixture</title>
    <style>
      body {
        margin: 0;
        background: #ffffff;
        color: #111827;
        font-family: system-ui, sans-serif;
      }
      a {
        color: #1d4ed8;
      }
      .layout {
        margin: 0 auto;
        max-width: 40rem;
        padding: 1.5rem;
      }
      label {
        display: block;
        margin-top: 0.75rem;
      }
    </style>
  </head>
  <body>
    <!--
      The control page. It is meant to produce as few automated findings as
      possible, so that a fixture audit which suddenly reports many findings
      here points at an Ally regression rather than at the page.
    -->
    <header>
      <nav aria-label="Main">
        <ul>
          <li><a href="#main">Skip to content</a></li>
          <li><a href="/products">Products</a></li>
        </ul>
      </nav>
    </header>

    <main id="main" class="layout">
      <h1>Accessible baseline</h1>
      <p>Every control on this page has an accessible name and sufficient contrast.</p>

      <h2>Sign in</h2>
      <form action="/session" method="post">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" />

        <p><button type="submit">Sign in</button></p>
      </form>

      <h2>Illustration</h2>
      <img
        src="data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw=="
        width="24"
        height="24"
        alt="A single transparent pixel"
      />
    </main>

    <footer class="layout">
      <p>Ally fixture page. Not a real product.</p>
    </footer>
  </body>
</html>
