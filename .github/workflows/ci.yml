name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - hosted-web-audit-mvp

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          PUBLIC_SITE_URL: https://ally.andersseen.dev
          PUBLIC_ALLY_API_BASE: https://ally.andersseen.dev
          PUBLIC_UMAMI_URL: https://umami.andersseen.dev/script.js
          PUBLIC_UMAMI_WEBSITE_ID: ade5376e-baba-4f88-b4b7-dab4ef7d97b3
