name: WCAG Freshness

on:
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:

jobs:
  check-wcag-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm wcag:sync
      - name: Show dataset diff
        run: git diff -- packages/wcag/data/manifest.json packages/wcag/data/wcag-2.2.normative.json packages/wcag/data/wcag-2.2.guidance.json
