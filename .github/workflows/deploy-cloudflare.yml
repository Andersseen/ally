name: Deploy Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

env:
  PUBLIC_SITE_URL: https://ally.andersseen.dev
  PUBLIC_ALLY_API_BASE: https://ally-api.andersseen.dev

jobs:
  deploy:
    name: Deploy Worker and Pages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://ally.andersseen.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test

      - name: Prepare Wrangler config
        run: node scripts/prepare-cloudflare-deploy.mjs
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

      - name: Build web app
        run: pnpm --filter @ally/web build

      - name: Apply D1 migrations
        run: pnpm --filter @ally/worker exec wrangler d1 migrations apply ally-audits --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/worker
          command: deploy
          secrets: |
            DEV_AUTH_CLIENT_SECRET
            ALLY_SESSION_SECRET
        env:
          DEV_AUTH_CLIENT_SECRET: ${{ secrets.DEV_AUTH_CLIENT_SECRET }}
          ALLY_SESSION_SECRET: ${{ secrets.ALLY_SESSION_SECRET }}

      - name: Deploy Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name ally-web
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
