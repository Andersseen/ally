name: Deploy Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

env:
  PUBLIC_SITE_URL: https://ally.andersseen.dev
  PUBLIC_ALLY_API_BASE: https://ally.andersseen.dev

jobs:
  deploy:
    name: Deploy Worker and Pages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://ally.andersseen.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check deployment secrets
        id: deployment-secrets
        run: |
          missing=()
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing+=("CLOUDFLARE_API_TOKEN")
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing+=("CLOUDFLARE_ACCOUNT_ID")
          [ -n "$CLOUDFLARE_D1_DATABASE_ID" ] || missing+=("CLOUDFLARE_D1_DATABASE_ID")
          [ -n "$DEV_AUTH_CLIENT_SECRET" ] || missing+=("DEV_AUTH_CLIENT_SECRET")
          [ -n "$ALLY_SESSION_SECRET" ] || missing+=("ALLY_SESSION_SECRET")

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'ready=false\n' >> "$GITHUB_OUTPUT"
            printf 'missing=%s\n' "$(IFS=', '; echo "${missing[*]}")" >> "$GITHUB_OUTPUT"
            printf 'Cloudflare deploy skipped. Missing GitHub secrets: %s\n' "$(IFS=', '; echo "${missing[*]}")" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          printf 'ready=true\n' >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          DEV_AUTH_CLIENT_SECRET: ${{ secrets.DEV_AUTH_CLIENT_SECRET }}
          ALLY_SESSION_SECRET: ${{ secrets.ALLY_SESSION_SECRET }}

      - name: Setup pnpm
        if: steps.deployment-secrets.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - name: Setup Node
        if: steps.deployment-secrets.outputs.ready == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22.20.0
          cache: pnpm

      - name: Install dependencies
        if: steps.deployment-secrets.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Verify
        if: steps.deployment-secrets.outputs.ready == 'true'
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test

      - name: Prepare Wrangler config
        if: steps.deployment-secrets.outputs.ready == 'true'
        run: node scripts/prepare-cloudflare-deploy.mjs
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

      - name: Build web app
        if: steps.deployment-secrets.outputs.ready == 'true'
        run: pnpm --filter @ally/web build

      - name: Apply D1 migrations
        if: steps.deployment-secrets.outputs.ready == 'true'
        run: pnpm --filter @ally/worker exec wrangler d1 migrations apply ally-audits --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        if: steps.deployment-secrets.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/worker
          command: deploy
          secrets: |
            DEV_AUTH_CLIENT_SECRET
            ALLY_SESSION_SECRET
        env:
          DEV_AUTH_CLIENT_SECRET: ${{ secrets.DEV_AUTH_CLIENT_SECRET }}
          ALLY_SESSION_SECRET: ${{ secrets.ALLY_SESSION_SECRET }}

      - name: Deploy Pages
        if: steps.deployment-secrets.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name ally-web
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
