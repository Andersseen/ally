openapi: 3.1.0
info:
  title: Ally Hosted Web Audit API
  summary: API for the hosted Ally accessibility audit MVP.
  version: 0.1.0
  description: |
    Ally accepts a public URL, queues an automated accessibility audit, exposes
    status polling, and returns the normalized audit artifact when complete.

    Authentication routes use DevFlare dev-auth. Hosted audit routes require a
    valid Ally app session to protect Cloudflare free-tier resources.
servers:
  - url: http://127.0.0.1:8787
    description: Local Node audit API used by pnpm dev.
  - url: https://ally.andersseen.dev
    description: Production site origin; Worker serves /api/* and Pages serves the UI.
tags:
  - name: Auth
    description: dev-auth OIDC client routes and Ally app session state.
  - name: Audits
    description: Hosted audit queue, polling, and result retrieval.
  - name: Compatibility
    description: Cloudflare Worker adapter compatibility spike.
  - name: Runner
    description: |
      Machine-to-machine surface for the standalone Node runner (apps/runner)
      only. Authenticated by a bearer ALLY_RUNNER_SECRET, never by a user
      session or DevAuth. The runner has no D1/R2 access of its own — every
      state change and artifact it produces goes through these routes.
paths:
  /api/auth/session:
    get:
      tags: [Auth]
      operationId: getAuthSession
      summary: Read the current Ally app session.
      description: |
        Returns whether the browser has a valid signed Ally session cookie.
        This endpoint does not contact dev-auth on every request.
      responses:
        '200':
          description: Current auth session status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionStatus'
              examples:
                unauthenticated:
                  value:
                    authenticated: false
                    configured: true
                    provider:
                      issuer: https://auth-devflare.andersseen.dev
                      clientId: ally-dev
                    loginUrl: /api/auth/login?returnTo=%2Fdashboard
  /api/auth/login:
    get:
      tags: [Auth]
      operationId: startAuthLogin
      summary: Start a dev-auth OIDC login.
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            default: /
          description: Same-site path to return to after login. Absolute URLs are rejected.
      responses:
        '302':
          description: Redirects to dev-auth authorize endpoint and sets the OAuth transaction cookie.
          headers:
            Location:
              schema:
                type: string
              description: dev-auth authorization URL.
            Set-Cookie:
              schema:
                type: string
              description: Signed-in flow transaction cookie.
  /api/auth/callback:
    get:
      tags: [Auth]
      operationId: completeAuthLogin
      summary: Complete the dev-auth authorization code flow.
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: true
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirects back to the web app and sets or clears Ally cookies.
        '503':
          description: Missing session secret configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Clear the Ally app session cookie.
      responses:
        '200':
          description: Session cookie cleared.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true
  /api/audits:
    post:
      tags: [Audits]
      operationId: createAudit
      summary: Queue an audit for a public URL.
      security:
        - AllySession: []
      description: |
        The URL must be absolute, use http or https, and must not contain
        credentials. The queue consumer performs the audit asynchronously.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              additionalProperties: false
              properties:
                url:
                  type: string
                  format: uri
                  examples:
                    - https://www.andriipap.dev/
      responses:
        '202':
          description: Audit job accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAuditResponse'
        '400':
          description: Invalid URL input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/AuthNotConfigured'
    get:
      tags: [Audits]
      operationId: listAudits
      summary: List the caller's own recent audits.
      security:
        - AllySession: []
      description: |
        Owner-scoped and capped at the 20 most recent audits, newest first.
        Powers the dashboard's "Recent audits" list.
      responses:
        '200':
          description: Recent audits.
          content:
            application/json:
              schema:
                type: object
                required: [audits]
                properties:
                  audits:
                    type: array
                    items:
                      $ref: '#/components/schemas/Audit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/AuthNotConfigured'
  /api/audits/{id}:
    get:
      tags: [Audits]
      operationId: getAudit
      summary: Read an audit status row.
      security:
        - AllySession: []
      parameters:
        - $ref: '#/components/parameters/AuditId'
      responses:
        '200':
          description: Audit status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Audit'
        '404':
          description: Audit ID was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/AuthNotConfigured'
  /api/audits/{id}/result:
    get:
      tags: [Audits]
      operationId: getAuditResult
      summary: Read the completed normalized audit artifact.
      security:
        - AllySession: []
      parameters:
        - $ref: '#/components/parameters/AuditId'
      responses:
        '200':
          description: Shared Ally AuditResult JSON artifact.
          content:
            application/json:
              schema:
                type: object
                description: Serialized @ally/core AuditResult.
                additionalProperties: true
        '404':
          description: Audit or artifact was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Audit has not completed yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/AuthNotConfigured'
  /api/runner/audits/{id}/claim:
    post:
      tags: [Runner]
      operationId: claimRunnerAudit
      summary: Claim an audit job (or find it already terminal).
      security:
        - RunnerSecret: []
      description: |
        Idempotent: legal from `queued`, `claimed`, or `running` (a redelivered
        queue message re-claims cleanly), and safe to call after the audit
        already reached a terminal state — the response says so instead of
        re-running it. Increments the server-side `attempt` counter and fails
        the audit outright once `AUDIT_MAX_ATTEMPTS` is exceeded.
      parameters:
        - $ref: '#/components/parameters/AuditId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                runnerId:
                  type: string
      responses:
        '200':
          description: Claim result.
          content:
            application/json:
              schema:
                type: object
                required: [terminal]
                properties:
                  terminal:
                    type: boolean
                  status:
                    $ref: '#/components/schemas/AuditStatus'
                  attempt:
                    type: integer
        '401':
          $ref: '#/components/responses/RunnerUnauthorized'
        '404':
          $ref: '#/components/responses/RunnerNotFound'
  /api/runner/audits/{id}/running:
    post:
      tags: [Runner]
      operationId: markRunnerAuditRunning
      summary: Transition claimed -> running.
      security:
        - RunnerSecret: []
      parameters:
        - $ref: '#/components/parameters/AuditId'
      responses:
        '200':
          description: New status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/AuditStatus'
        '401':
          $ref: '#/components/responses/RunnerUnauthorized'
        '404':
          $ref: '#/components/responses/RunnerNotFound'
        '409':
          $ref: '#/components/responses/RunnerInvalidTransition'
  /api/runner/audits/{id}/stage:
    post:
      tags: [Runner]
      operationId: reportRunnerAuditStage
      summary: Report per-engine/keyboard progress.
      security:
        - RunnerSecret: []
      description: |
        Powers the dashboard's real, backend-driven progress display. A no-op
        (200) once the audit is already terminal, so a late/duplicate report
        from a lagging attempt cannot resurrect finished state.
      parameters:
        - $ref: '#/components/parameters/AuditId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [stage, status]
              properties:
                stage:
                  type: string
                status:
                  type: string
                  enum: [started, ok, failed]
                durationMs:
                  type: integer
      responses:
        '200':
          description: Accepted.
        '400':
          description: Missing stage or status.
        '401':
          $ref: '#/components/responses/RunnerUnauthorized'
        '404':
          $ref: '#/components/responses/RunnerNotFound'
  /api/runner/audits/{id}/persisting:
    post:
      tags: [Runner]
      operationId: markRunnerAuditPersisting
      summary: Transition running -> persisting.
      security:
        - RunnerSecret: []
      parameters:
        - $ref: '#/components/parameters/AuditId'
      responses:
        '200':
          description: New status.
        '401':
          $ref: '#/components/responses/RunnerUnauthorized'
        '404':
          $ref: '#/components/responses/RunnerNotFound'
        '409':
          $ref: '#/components/responses/RunnerInvalidTransition'
  /api/runner/audits/{id}/complete:
    post:
      tags: [Runner]
      operationId: completeRunnerAudit
      summary: Persist the finished artifact and mark the audit completed.
      security:
        - RunnerSecret: []
      description: |
        The Worker performs the R2 writes here, to the final
        `audits/<id>/audit.json` and `audits/<id>/raw/<engine>.json` keys —
        the only place those keys are ever written, so a retried job can
        never leave a partially-written final artifact.
      parameters:
        - $ref: '#/components/parameters/AuditId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result:
                  type: object
                  description: Serialized @ally/core AuditResult.
                  additionalProperties: true
                raw:
                  type: object
                  description: Raw per-engine output, keyed by engine id.
                  additionalProperties: true
      responses:
        '200':
          description: Completed.
        '400':
          description: Missing result.
        '401':
          $ref: '#/components/responses/RunnerUnauthorized'
        '404':
          $ref: '#/components/responses/RunnerNotFound'
        '409':
          $ref: '#/components/responses/RunnerInvalidTransition'
  /api/runner/audits/{id}/fail:
    post:
      tags: [Runner]
      operationId: failRunnerAudit
      summary: Mark the audit failed (or timed_out for the audit-timeout category).
      security:
        - RunnerSecret: []
      parameters:
        - $ref: '#/components/parameters/AuditId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [category, message]
              properties:
                category:
                  type: string
                  description: One of @ally/runner-core's FailureCategory values.
                message:
                  type: string
                  description: Always a safe, developer-facing message — never a stack trace.
      responses:
        '200':
          description: New status.
        '401':
          $ref: '#/components/responses/RunnerUnauthorized'
        '404':
          $ref: '#/components/responses/RunnerNotFound'
        '409':
          $ref: '#/components/responses/RunnerInvalidTransition'
  /api/compatibility:
    get:
      tags: [Compatibility]
      operationId: runCompatibilitySpike
      summary: Test Worker runtime compatibility for audit adapters.
      security:
        - AllySession: []
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
            format: uri
      responses:
        '200':
          description: Adapter compatibility report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompatibilityReport'
        '400':
          description: Invalid URL input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/AuthNotConfigured'
components:
  securitySchemes:
    AllySession:
      type: apiKey
      in: cookie
      name: ally_session
      description: Signed Ally app session cookie issued after dev-auth login.
    RunnerSecret:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer <ALLY_RUNNER_SECRET>`. Machine-to-machine only
        — the standalone Node runner, never a user session. Constant-time
        compared; unset secret fails closed with 503.
  responses:
    Unauthorized:
      description: Missing or invalid Ally app session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            required:
              value:
                error: Authentication required
    AuthNotConfigured:
      description: Ally auth secrets are not configured, so protected routes fail closed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missingSecret:
              value:
                error: Authentication is not configured
    RunnerUnauthorized:
      description: Missing/invalid runner secret, or ALLY_RUNNER_SECRET is unset (fails closed).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RunnerNotFound:
      description: Audit ID was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RunnerInvalidTransition:
      description: The audit's current status does not allow this transition.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  parameters:
    AuditId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    AuthSessionStatus:
      type: object
      required: [authenticated, configured, provider, loginUrl]
      properties:
        authenticated:
          type: boolean
        configured:
          type: boolean
          description: True when Ally has a session-signing secret configured.
        user:
          $ref: '#/components/schemas/AuthUser'
        expiresAt:
          type: string
          format: date-time
        provider:
          type: object
          required: [issuer, clientId]
          properties:
            issuer:
              type: string
              format: uri
            clientId:
              type: string
        loginUrl:
          type: string
    AuthUser:
      type: object
      required: [id, email, name, image]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        image:
          type:
            - string
            - 'null'
          format: uri
    CreateAuditResponse:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          const: queued
    Audit:
      type: object
      required:
        - id
        - url
        - status
        - currentStage
        - attempt
        - createdAt
        - updatedAt
        - startedAt
        - completedAt
        - lastError
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        status:
          $ref: '#/components/schemas/AuditStatus'
        currentStage:
          type:
            - string
            - 'null'
          description: |
            `"<engine-id-or-keyboard>:<started|ok|failed>"`, updated live as
            the runner works through engines and the keyboard analyzer. Real
            backend-reported progress, not a simulated percentage.
        attempt:
          type: integer
          description: Incremented on every re-claim. Capped by AUDIT_MAX_ATTEMPTS.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        startedAt:
          type:
            - string
            - 'null'
          format: date-time
        completedAt:
          type:
            - string
            - 'null'
          format: date-time
        lastError:
          type:
            - string
            - 'null'
          description: A safe, developer-facing message. Never a stack trace or internal detail.
        summary:
          $ref: '#/components/schemas/AuditSummary'
        resultUrl:
          type: string
    AuditStatus:
      type: string
      description: |
        `claimed` and `persisting` exist for debuggability; the dashboard
        groups `claimed` with `queued` and `persisting` with `running`.
        `timed_out` and `cancelled` are terminal, same as `failed`.
      enum: [queued, claimed, running, persisting, completed, failed, timed_out, cancelled]
    AuditSummary:
      type: object
      required:
        - score
        - scoreVersion
        - uniqueFindings
        - rawFindings
        - keyboardWarnings
        - enginesSucceeded
        - enginesConfigured
        - enginesFailed
      properties:
        score:
          type:
            - integer
            - 'null'
        scoreVersion:
          type:
            - integer
            - 'null'
        uniqueFindings:
          type:
            - integer
            - 'null'
        rawFindings:
          type:
            - integer
            - 'null'
          description: Findings across all engines before deduplication.
        keyboardWarnings:
          type:
            - integer
            - 'null'
          description: Keyboard-analyzer anomaly count.
        enginesSucceeded:
          type:
            - integer
            - 'null'
        enginesConfigured:
          type:
            - integer
            - 'null'
        enginesFailed:
          type:
            - integer
            - 'null'
    CompatibilityReport:
      type: object
      required: [url, runtime, generatedAt, checks]
      properties:
        url:
          type: string
          format: uri
        runtime:
          type: string
          const: cloudflare-workers-browser-run
        generatedAt:
          type: string
          format: date-time
        loadError:
          type: string
        checks:
          type: array
          items:
            $ref: '#/components/schemas/CompatibilityCheck'
    CompatibilityCheck:
      type: object
      required: [id, runsDirectlyInWorker]
      properties:
        id:
          type: string
        name:
          type: string
        runsDirectlyInWorker:
          type: boolean
        durationMs:
          type: integer
        rawCount:
          type: integer
        normalizedCount:
          type: integer
        error:
          type: string
        requiresNodeApis:
          type: boolean
        requiresFilesystem:
          type: boolean
        requiresBrowserInjection:
          type: boolean
        notes:
          type: array
          items:
            type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
